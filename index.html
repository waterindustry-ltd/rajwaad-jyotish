<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajwaad Jyotish — Legal &amp; Policy</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5b6270; --border:#e4e7eb;
    --accent:#2563eb; --card:#f7f8fa; --maxw:640px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12141a; --fg:#e9ebef; --muted:#9aa2b1; --border:#2a2e37; --accent:#7aa2ff; --card:#1a1d24; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:3.5rem 1.25rem 4rem;}
  .brand{font-size:.85rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 .4rem;}
  h1{font-size:1.6rem; margin:0 0 .5rem; line-height:1.3;}
  p.sub{color:var(--muted); margin:0 0 2rem;}
  nav{display:grid; gap:.75rem;}
  nav a{
    display:flex; justify-content:space-between; align-items:center;
    padding:1rem 1.2rem; border:1px solid var(--border); border-radius:10px;
    text-decoration:none; color:var(--fg); background:var(--card);
    font-weight:600; transition:border-color .15s;
  }
  nav a:hover{border-color:var(--accent);}
  nav a span.arrow{color:var(--muted); font-weight:400;}
  footer{margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--border); color:var(--muted); font-size:.88rem;}
  footer a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Nước Sạch</p>
  <h1>Rajwaad Jyotish</h1>
  <p class="sub">Legal &amp; policy pages</p>
  <nav>
    <a href="./privacy/">Privacy Policy <span class="arrow">&rarr;</span></a>
    <a href="./terms/">Terms of Use <span class="arrow">&rarr;</span></a>
    <a href="./delete-data/">Data Deletion <span class="arrow">&rarr;</span></a>
  </nav>
  <footer>
    <p><strong>Nước Sạch</strong> &middot; <a href="mailto:minhhang68930@gmail.com">minhhang68930@gmail.com</a></p>
  </footer>
</div>
</body>
</html>
